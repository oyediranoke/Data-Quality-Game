<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Quality Challenge - Google Sheets Leaderboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222}.container{max-width:980px;margin:28px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.1)}
h1,h2{color:#1f4e79}.scenario{font-size:1.25rem;line-height:1.5;background:#eef5fb;border-left:6px solid #1f4e79;padding:18px;border-radius:8px;margin:18px 0}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}button{padding:12px 14px;border:0;border-radius:8px;background:#1f4e79;color:white;font-size:1rem;cursor:pointer}button:hover{background:#163a59}button:disabled{opacity:.7;cursor:not-allowed}.secondary{background:#666}.feedback{margin-top:18px;padding:16px;border-radius:8px;display:none}.correct{background:#e6f4ea;border:1px solid #2e7d32}.wrong{background:#fdecea;border:1px solid #c62828}.hidden{display:none}input{padding:12px;border:1px solid #bbb;border-radius:8px;font-size:1rem;width:min(420px,95%)}.topbar,.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #ddd;padding:10px;text-align:left}th{background:#eef5fb;color:#1f4e79}.score{font-size:1.4rem;font-weight:bold;color:#1f4e79}.note{background:#fff8e1;border-left:5px solid #f9a825;padding:12px;border-radius:8px}.review-card{border:1px solid #ddd;border-radius:8px;padding:14px;margin:12px 0;background:#fafafa}.leaderboard-frame-wrap{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin:12px 0}.leaderboard-frame{width:100%;height:320px;border:0;background:white}
</style></head><body><div class="container">
<div id="start"><h1>Data Quality Challenge</h1><p>Enter your name, play the game, and submit your score to the class leaderboard.</p><input id="studentName" placeholder="Enter your name"><button onclick="startGame()">Start Game</button><h2>Live Leaderboard</h2><div class="leaderboard-frame-wrap"><iframe class="leaderboard-frame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTealfls6wr1qF90Rv6ChPMYF5LtF2645NuIBR7ApZSNt54WWCeIm6GyfBIHDJ7KIciMBv1CajnVHg9/pubhtml?gid=1208354822&single=true&widget=true&headers=false"></iframe></div></div>
<div id="game" class="hidden"><h1>Data Quality Challenge</h1><div class="topbar"><div id="playerDisplay"></div><div id="liveScore"></div></div><div id="progress"></div><div class="scenario" id="scenario"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="nav"><button class="secondary" onclick="prevQuestion()">Previous</button><button onclick="nextQuestion()" id="nextBtn">Next</button></div></div>
<div id="result" class="hidden"><h1>Final Result</h1><div class="score" id="score"></div><div id="badge"></div><p id="submitStatus"></p><h2>Live Leaderboard</h2><div class="leaderboard-frame-wrap"><iframe class="leaderboard-frame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTealfls6wr1qF90Rv6ChPMYF5LtF2645NuIBR7ApZSNt54WWCeIm6GyfBIHDJ7KIciMBv1CajnVHg9/pubhtml?gid=1208354822&single=true&widget=true&headers=false"></iframe></div><button onclick="restart()">Play Again</button><h2>Review Answers</h2><div id="review"></div></div>
</div><script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHg0KQQy8z3GlvNOAUUu6Ka2ojjBXsek7cvbVNb6Z_ceg9c736YlHP60S9z0IXWBovLA/exec";
// NOTE: Replace SCRIPT_URL if you redeploy Google Apps Script and Google gives you a new Web App URL.
// NOTE: Replace the iframe src URL if you republish or change the Google Sheet leaderboard tab.
const questions = [{"scenario": "35% of customer records have no email address, even though email is required for communication campaigns.", "answer": "Completeness", "explanation": "Required data (email) is missing from many records."}, {"scenario": "A customer appears twice in the CRM system with two different customer IDs.", "answer": "Uniqueness", "explanation": "The same entity is represented more than once in the dataset."}, {"scenario": "Sales revenue in the finance system shows $1.2M, while the BI dashboard shows $1.35M for the same month.", "answer": "Consistency", "explanation": "The same metric shows conflicting values across systems."}, {"scenario": "A field meant to store gender type contains entries like 'M', 'Male', 'F ' and 'Female'.", "answer": "Validity", "explanation": "The values do not follow a defined standard/allowable format."}, {"scenario": "A field meant to store dates contains entries like 'Next Friday' and 'TBD'.", "answer": "Validity", "explanation": "The values do not conform to the defined date format or allowable data type."}, {"scenario": "The operations dashboard uses data that is updated once every two weeks, but managers require daily updates.", "answer": "Timeliness", "explanation": "The data is not updated frequently enough to support operational decisions."}, {"scenario": "A marketing team uses website click data to evaluate employee performance.", "answer": "Relevance", "explanation": "The data is not appropriate for evaluating employee performance."}, {"scenario": "Some transactions are missing product category values.", "answer": "Completeness", "explanation": "Required data (product category) is missing for some records."}, {"scenario": "Customer status is labeled 'Active' in one system and 'Current' in another system for the same meaning.", "answer": "Consistency", "explanation": "The same concept is represented differently across systems."}, {"scenario": "A report includes data from last year when management expects current-year performance.", "answer": "Timeliness", "explanation": "The data does not reflect the required time period for decision-making."}, {"scenario": "A field designed to accept only numeric product codes contains values like 'ABC123'.", "answer": "Validity", "explanation": "The value violates defined format and allowable data type rules."}, {"scenario": "Two different definitions of 'Active Customer' are used in separate reports.", "answer": "Consistency", "explanation": "The same metric is defined differently across reports, leading to inconsistent interpretation."}, {"scenario": "A warehouse inventory system records 500 units in stock, but the physical count shows 430 units.", "answer": "Accuracy", "explanation": "The recorded value does not correctly represent real-world inventory."}, {"scenario": "A satisfaction survey includes only responses from premium customers but is used to represent all customers.", "answer": "Relevance", "explanation": "The data is not appropriate for representing the full customer base."}, {"scenario": "A dataset includes duplicate invoice numbers due to repeated uploads.", "answer": "Uniqueness", "explanation": "Each invoice should appear only once; duplicates violate uniqueness."}, {"scenario": "A revenue column contains negative values where business rules prohibit negative sales.", "answer": "Validity", "explanation": "The values violate the defined business rules and allowable ranges."}, {"scenario": "A KPI uses monthly aggregated data while targets are defined at daily level without adjustment.", "answer": "Consistency", "explanation": "The mismatch in granularity creates an inconsistent comparison."}, {"scenario": "Several required address fields (postal code and city) are left blank in supplier records.", "answer": "Completeness", "explanation": "Required data elements are missing."}, {"scenario": "The BI dashboard reflects data that is three months old due to delayed system integration.", "answer": "Timeliness", "explanation": "The data is not current enough for effective decision-making."}, {"scenario": "Customer age is calculated incorrectly because birth year was entered inaccurately.", "answer": "Accuracy", "explanation": "The derived value is incorrect due to incorrect source data."}, {"scenario": "A customer's date of birth is recorded as 2056 instead of 1965.", "answer": "Accuracy", "explanation": "The value does not correctly represent the real-world date of birth."}, {"scenario": "The sales team manually enters discount percentages. Some entries show '15', others show '0.15', and others show '15%', leading to distorted revenue calculations.", "answer": "Validity", "explanation": "The values do not follow standardized input formats, leading to incorrect interpretation."}, {"scenario": "A customer churn report excludes customers who cancelled in the last 7 days because the cancellation system updates weekly.", "answer": "Completeness", "explanation": "Relevant records are missing from the dataset at the time of reporting."}, {"scenario": "A global revenue dashboard combines sales recorded in USD, CAD, and EUR without currency conversion, inflating total revenue figures.", "answer": "Accuracy", "explanation": "The totals are incorrect because currency values were combined without proper normalization."}, {"scenario": "A predictive model uses five years of historical purchasing data, even though the company changed its pricing model two years ago.", "answer": "Relevance", "explanation": "The historical data may be accurate and complete, but it is no longer appropriate for the current business environment."}];
const options = ["Accuracy", "Completeness", "Consistency", "Timeliness", "Validity", "Uniqueness", "Relevance"];
let current=0, answers=Array(questions.length).fill(null), score=0, studentName='';
function startGame(){studentName=document.getElementById('studentName').value.trim(); if(!studentName){alert('Please enter your name.');return;} document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');showQuestion();}
function showQuestion(){const q=questions[current];document.getElementById('playerDisplay').textContent='Player: '+studentName;document.getElementById('liveScore').textContent='Score: '+score+'/'+questions.length;document.getElementById('progress').textContent='Question '+(current+1)+' of '+questions.length;document.getElementById('scenario').textContent=q.scenario;const box=document.getElementById('options');box.innerHTML='';options.forEach(opt=>{const b=document.createElement('button');b.textContent=opt;b.onclick=()=>selectAnswer(opt);if(answers[current]) b.disabled=true;box.appendChild(b);});const f=document.getElementById('feedback');f.style.display='none';if(answers[current]) showFeedback(answers[current]);document.getElementById('nextBtn').textContent=current===questions.length-1?'Finish':'Next';}
function selectAnswer(opt){if(answers[current])return;answers[current]=opt;if(opt===questions[current].answer)score++;showQuestion();}
function showFeedback(selected){const q=questions[current], ok=selected===q.answer, f=document.getElementById('feedback');f.className='feedback '+(ok?'correct':'wrong');f.innerHTML=(ok?'✅ Correct!':'❌ Not correct.')+'<br><b>'+q.answer+'</b> – '+q.explanation;f.style.display='block';}
function nextQuestion(){if(!answers[current]){alert('Please select an answer.');return;} if(current<questions.length-1){current++;showQuestion();}else finish();}
function prevQuestion(){if(current>0){current--;showQuestion();}}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');const pct=Math.round(score/questions.length*100);document.getElementById('score').textContent=studentName+', your score is '+score+'/'+questions.length+' ('+pct+'%).';document.getElementById('badge').innerHTML='<h2>🏅 '+getBadge()+'</h2>';renderReview();submitScore();}
function getBadge(){const pct=Math.round(score/questions.length*100);if(pct===100)return 'Data Quality Master';if(pct>=88)return 'Data Steward';if(pct>=72)return 'BI Analyst';return 'Data Explorer';}
async function submitScore(){const status=document.getElementById('submitStatus'); if(SCRIPT_URL.includes('PASTE_YOUR')){status.textContent='Instructor must paste the Google Apps Script Web App URL first.';return;} status.textContent='Submitting score automatically...';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentName,score,totalQuestions:questions.length,percentage:Math.round(score/questions.length*100),badge:getBadge()})});status.textContent='Score submitted automatically. The leaderboard below updates from Google Sheet. Refresh the page if the latest score is not visible immediately.';}catch(e){status.textContent='Could not submit score: '+e.message;}}
function loadLeaderboard(target){const div=document.getElementById(target);if(!div)return;if(SCRIPT_URL.includes('PASTE_YOUR')){div.innerHTML='<p>Leaderboard will appear after instructor setup.</p>';return;}const callback='showLeaderboard_'+Date.now();window[callback]=function(data){try{const rows=(data&&data.leaderboard)||[];if(rows.length===0){div.innerHTML='<p>No scores yet. Be the first to play.</p>';return;}div.innerHTML='<table><tr><th>Rank</th><th>Name</th><th>Score</th><th>%</th><th>Badge</th></tr>'+rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.studentName+'</td><td>'+x.score+'/'+x.totalQuestions+'</td><td>'+x.percentage+'%</td><td>'+x.badge+'</td></tr>').join('')+'</table>';}finally{delete window[callback];}};const script=document.createElement('script');script.src=SCRIPT_URL+'?callback='+callback+'&t='+Date.now();script.onerror=function(){div.innerHTML='<p>Leaderboard could not be loaded. Check deployment permissions and redeploy the Apps Script.</p>';};document.body.appendChild(script);}
function renderReview(){const d=document.getElementById('review');d.innerHTML='';questions.forEach((q,i)=>{const card=document.createElement('div');card.className='review-card';card.innerHTML='<b>Question '+(i+1)+':</b> '+q.scenario+'<br>Your answer: '+answers[i]+'<br>Correct answer: <b>'+q.answer+'</b><br>'+q.explanation;d.appendChild(card);})}
function restart(){location.reload();}

</script></body></html>
